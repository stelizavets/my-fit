<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Мои Тренировки</title>

  <!-- PWA настройки для iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Тренировки">
  <meta name="theme-color" content="#0d0e12">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">

  <!-- Chart.js для графиков -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #181a22;
      --card-sub: #222530;
      --accent: #ff4757;
      --accent-green: #2ed573;
      --accent-blue: #1e90ff;
      --text: #ffffff;
      --text-muted: #8e95a5;
      --border: #282c3a;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 75px);
      user-select: none;
    }

    header {
      padding: 14px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .save-indicator {
      font-size: 12px;
      color: var(--accent-green);
      font-weight: 600;
      background: rgba(46, 213, 115, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      transition: opacity 0.3s;
    }

    /* Навигатор по датам */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px 14px;
      gap: 8px;
    }

    .date-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .date-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 10px;
      position: relative;
    }

    .date-input-wrap input[type="date"] {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      outline: none;
      text-align: center;
    }

    /* Контейнер вкладок */
    main {
      flex: 1;
      padding: 0 16px;
      overflow-y: auto;
    }

    .tab-view {
      display: none;
    }

    .tab-view.active {
      display: block;
      animation: fadeIn 0.15s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Карточки */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    /* Кнопки */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-secondary {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 8px;
      width: auto;
    }

    /* Блок одного упражнения */
    .exercise-block {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 14px;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .ex-name {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    /* Поле заметок */
    .note-input {
      width: 100%;
      background: var(--card-sub);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      color: #e0e4ee;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }

    .note-input::placeholder {
      color: var(--text-muted);
    }

    .note-input:focus {
      border-color: var(--accent-blue);
      border-style: solid;
    }

    /* Сетка подходов */
    .set-row {
      display: grid;
      grid-template-columns: 32px 1fr 1fr 38px 28px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .set-head {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .input-num {
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      padding: 7px 4px;
      width: 100%;
      outline: none;
    }

    .input-num:focus {
      border-color: var(--accent);
    }

    .check-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    .check-btn.done {
      background: var(--accent-green);
      color: #0d0e12;
      border-color: var(--accent-green);
    }

    .del-btn {
      color: var(--text-muted);
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    /* Нижняя панель iOS */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-bottom, 20px));
      padding-bottom: env(safe-area-inset-bottom, 20px);
      background: rgba(24, 26, 34, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
    }

    .tab-item.active {
      color: var(--accent);
    }

    .tab-icon {
      font-size: 20px;
      margin-bottom: 2px;
    }

    select {
      background: var(--card-sub);
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
      width: 100%;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    .history-card {
      border-left: 4px solid var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="view-title">Дневник</h1>
    <div id="save-tag" class="save-indicator">Сохранено</div>
  </header>

  <!-- Выбор даты (активен на вкладке Дневника) -->
  <div id="date-navigator" class="date-bar">
    <button class="date-pill" onclick="changeDateByDays(-1)">← Вчера</button>
    <div class="date-input-wrap">
      <input type="date" id="selected-date" onchange="onDateChanged()">
    </div>
    <button class="date-pill" onclick="changeDateByDays(1)">Завтра →</button>
  </div>

  <main>
    <!-- Вкладка 1: Дневник тренировки на выбранную дату -->
    <section id="tab-workout" class="tab-view active">
      <div id="exercise-list"></div>

      <button class="btn btn-secondary" onclick="openExerciseModal()" style="margin-top: 4px; margin-bottom: 12px;">
        + Добавить упражнение
      </button>

      <button class="btn btn-secondary" onclick="clearDayWorkout()" style="background: transparent; color: #ff5252; border-color: rgba(255,82,82,0.3); font-size: 13px;">
        Очистить тренировку этого дня
      </button>
    </section>

    <!-- Вкладка 2: Прогресс и Аналитика -->
    <section id="tab-progress" class="tab-view">
      <div class="card">
        <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Выберите упражнение:</label>
        <select id="progress-select" onchange="renderProgressChart()"></select>

        <div style="display: flex; gap: 8px;">
          <div style="flex: 1; background: var(--card-sub); padding: 12px; border-radius: 12px; text-align: center;">
            <div style="font-size: 11px; color: var(--text-muted);">Макс. вес (PR)</div>
            <div id="stat-max-weight" style="font-size: 22px; font-weight: 800; color: var(--accent); margin-top: 4px;">0 кг</div>
          </div>
          <div style="flex: 1; background: var(--card-sub); padding: 12px; border-radius: 12px; text-align: center;">
            <div style="font-size: 11px; color: var(--text-muted);">Всего подходов</div>
            <div id="stat-total-sets" style="font-size: 22px; font-weight: 800; color: var(--accent-green); margin-top: 4px;">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size: 15px; margin-bottom: 12px;">График роста весов</h3>
        <canvas id="progressChart" height="220"></canvas>
      </div>

      <div class="card">
        <h3 style="font-size: 15px; margin-bottom: 10px;">Заметки по этому упражнению</h3>
        <div id="exercise-notes-history" style="font-size: 13px; color: var(--text-muted);">
          Нет сохраненных заметок
        </div>
      </div>
    </section>

    <!-- Вкладка 3: История (Все дни) -->
    <section id="tab-history" class="tab-view">
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
        Нажмите на любой день, чтобы открыть и отредактировать:
      </p>
      <div id="history-container"></div>
    </section>

    <!-- Вкладка 4: Настройки / База -->
    <section id="tab-settings" class="tab-view">
      <div class="card">
        <h3 style="font-size: 16px; margin-bottom: 10px;">Добавить новое упражнение</h3>
        <input type="text" id="custom-ex-name" class="note-input" style="padding: 12px; font-size: 14px;" placeholder="Например: Сгибания на скамье Скотта...">
        <button class="btn btn-secondary" onclick="addCustomExercise()">Сохранить в каталог</button>
      </div>

      <div class="card">
        <h3 style="font-size: 16px; margin-bottom: 10px;">Резервная копия данных</h3>
        <button class="btn btn-secondary" style="margin-bottom: 8px;" onclick="exportData()">Скачать копию (JSON)</button>
        <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">Восстановить из файла</button>
        <input type="file" id="import-file" style="display: none;" onchange="importData(event)">
      </div>
    </section>
  </main>

  <!-- Нижняя панель навигации -->
  <nav class="tab-bar">
    <div class="tab-item active" onclick="switchTab('workout', 'Дневник')">
      <span class="tab-icon">📝</span>
      <span>Дневник</span>
    </div>
    <div class="tab-item" onclick="switchTab('progress', 'Прогресс')">
      <span class="tab-icon">📈</span>
      <span>Прогресс</span>
    </div>
    <div class="tab-item" onclick="switchTab('history', 'История')">
      <span class="tab-icon">📅</span>
      <span>История</span>
    </div>
    <div class="tab-item" onclick="switchTab('settings', 'Еще')">
      <span class="tab-icon">⚙️</span>
      <span>Еще</span>
    </div>
  </nav>

  <!-- Окно добавления упражнения -->
  <dialog id="exercise-modal" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 20px; padding: 20px; width: 90%; max-width: 400px; margin: auto;">
    <h3 style="margin-bottom: 12px;">Выберите упражнение</h3>
    <select id="modal-select-exercise"></select>
    <div style="display: flex; gap: 8px; margin-top: 14px;">
      <button class="btn btn-secondary" onclick="document.getElementById('exercise-modal').close()">Отмена</button>
      <button class="btn" onclick="confirmAddExercise()">Добавить</button>
    </div>
  </dialog>

  <script>
    const DEFAULT_EXERCISES = [
      "Жим штанги лежа",
      "Жим гантелей на наклонной скамье",
      "Приседания со штангой",
      "Становая тяга",
      "Тяга верхнего блока к груди",
      "Тяга штанги в наклоне",
      "Армейский жим стоя",
      "Махи гантелями в стороны",
      "Подъем штанги на бицепс",
      "Французский жим",
      "Сгибания ног в тренажере",
      "Разгибания ног в тренажере",
      "Гиперэкстензия",
      "Скручивания на пресс"
    ];

    // База данных: объект вида { "2026-10-30": [ { name, note, sets: [...] } ] }
    let db = JSON.parse(localStorage.getItem('fs_diary_db')) || {};
    let exercises = JSON.parse(localStorage.getItem('fs_exercises')) || DEFAULT_EXERCISES;
    let selectedDate = getTodayDate();
    let chartInstance = null;

    function getTodayDate() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    function init() {
      document.getElementById('selected-date').value = selectedDate;
      renderSelects();
      renderDayWorkout();
    }

    function renderSelects() {
      const modalSel = document.getElementById('modal-select-exercise');
      const progSel = document.getElementById('progress-select');
      modalSel.innerHTML = '';
      progSel.innerHTML = '';

      exercises.sort().forEach(ex => {
        modalSel.innerHTML += `<option value="${ex}">${ex}</option>`;
        progSel.innerHTML += `<option value="${ex}">${ex}</option>`;
      });
    }

    // Навигация по датам
    function changeDateByDays(delta) {
      const parts = selectedDate.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + delta);
      selectedDate = d.toISOString().split('T')[0];
      document.getElementById('selected-date').value = selectedDate;
      renderDayWorkout();
    }

    function onDateChanged() {
      selectedDate = document.getElementById('selected-date').value;
      renderDayWorkout();
    }

    // Вкладки
    function switchTab(tabId, title) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));

      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('view-title').innerText = title;
      event.currentTarget.classList.add('active');

      const dateNav = document.getElementById('date-navigator');
      if (tabId === 'workout') {
        dateNav.style.display = 'flex';
        renderDayWorkout();
      } else {
        dateNav.style.display = 'none';
      }

      if (tabId === 'history') renderHistoryTab();
      if (tabId === 'progress') renderProgressChart();
    }

    // Отрисовка упражнений на выбранный день
    function renderDayWorkout() {
      const cont = document.getElementById('exercise-list');
      cont.innerHTML = '';
      const dayList = db[selectedDate] || [];

      if (!dayList.length) {
        cont.innerHTML = `
          <div class="card" style="text-align: center; padding: 28px 16px; color: var(--text-muted);">
            <div style="font-size: 34px; margin-bottom: 8px;">📋</div>
            <div style="font-weight: 700; color: #fff; margin-bottom: 4px;">Нет записей на этот день</div>
            <div style="font-size: 13px;">Нажмите кнопку ниже, чтобы добавить упражнения на ${formatDate(selectedDate)}.</div>
          </div>
        `;
        return;
      }

      dayList.forEach((ex, exIdx) => {
        let setsHtml = '';
        ex.sets.forEach((set, setIdx) => {
          setsHtml += `
            <div class="set-row">
              <span style="font-weight: 700; color: var(--text-muted); text-align: center;">${setIdx + 1}</span>
              <input type="number" step="0.5" inputmode="decimal" class="input-num" placeholder="кг" value="${set.weight}" 
                     oninput="updateSet(${exIdx}, ${setIdx}, 'weight', this.value)">
              <input type="number" inputmode="numeric" class="input-num" placeholder="раз" value="${set.reps}" 
                     oninput="updateSet(${exIdx}, ${setIdx}, 'reps', this.value)">
              <div class="check-btn ${set.done ? 'done' : ''}" onclick="toggleSetDone(${exIdx}, ${setIdx})">
                ✓
              </div>
              <button class="del-btn" onclick="removeSet(${exIdx}, ${setIdx})">×</button>
            </div>
          `;
        });

        cont.innerHTML += `
          <div class="exercise-block">
            <div class="ex-header">
              <span class="ex-name">${ex.name}</span>
              <button class="del-btn" onclick="removeExercise(${exIdx})" style="font-size:13px; color: var(--accent);">Удалить</button>
            </div>

            <!-- Поле заметки к упражнению -->
            <input type="text" class="note-input" placeholder="Заметка к упражнению (ощущения, вес на след. раз...)" 
                   value="${ex.note || ''}" onchange="updateExerciseNote(${exIdx}, this.value)">

            <div class="set-row set-head">
              <span>Сет</span><span>Вес (кг)</span><span>Повт</span><span>Статус</span><span></span>
            </div>
            ${setsHtml}
            <button class="btn btn-secondary btn-sm" style="margin-top: 10px; width: 100%;" onclick="addSet(${exIdx})">
              + Добавить подход
            </button>
          </div>
        `;
      });
    }

    function openExerciseModal() {
      document.getElementById('exercise-modal').showModal();
    }

    function confirmAddExercise() {
      const name = document.getElementById('modal-select-exercise').value;
      if (!db[selectedDate]) db[selectedDate] = [];

      db[selectedDate].push({
        name: name,
        note: '',
        sets: [{ weight: '', reps: '', done: true }]
      });

      saveDB();
      document.getElementById('exercise-modal').close();
      renderDayWorkout();
    }

    function updateExerciseNote(exIdx, noteText) {
      db[selectedDate][exIdx].note = noteText;
      saveDB();
    }

    function addSet(exIdx) {
      const currentSets = db[selectedDate][exIdx].sets;
      const lastSet = currentSets[currentSets.length - 1] || { weight: '', reps: '' };
      currentSets.push({
        weight: lastSet.weight,
        reps: lastSet.reps,
        done: true
      });
      saveDB();
      renderDayWorkout();
    }

    function removeSet(exIdx, setIdx) {
      db[selectedDate][exIdx].sets.splice(setIdx, 1);
      saveDB();
      renderDayWorkout();
    }

    function removeExercise(exIdx) {
      db[selectedDate].splice(exIdx, 1);
      if (db[selectedDate].length === 0) delete db[selectedDate];
      saveDB();
      renderDayWorkout();
    }

    function toggleSetDone(exIdx, setIdx) {
      const s = db[selectedDate][exIdx].sets[setIdx];
      s.done = !s.done;
      saveDB();
      renderDayWorkout();
    }

    function updateSet(exIdx, setIdx, field, val) {
      db[selectedDate][exIdx].sets[setIdx][field] = val;
      saveDB();
    }

    function clearDayWorkout() {
      if (confirm('Точно удалить все упражнения за этот день?')) {
        delete db[selectedDate];
        saveDB();
        renderDayWorkout();
      }
    }

    function saveDB() {
      localStorage.setItem('fs_diary_db', JSON.stringify(db));
      const tag = document.getElementById('save-tag');
      tag.style.opacity = '1';
      setTimeout(() => { tag.style.opacity = '0.7'; }, 1000);
    }

    // Вкладка Истории
    function renderHistoryTab() {
      const cont = document.getElementById('history-container');
      cont.innerHTML = '';
      const dates = Object.keys(db).sort().reverse();

      if (!dates.length) {
        cont.innerHTML = '<div class="card" style="text-align:center; color: var(--text-muted);">История пока пуста</div>';
        return;
      }

      dates.forEach(d => {
        const exercisesInDay = db[d];
        let summary = exercisesInDay.map(e => e.name).join(' • ');

        cont.innerHTML += `
          <div class="card history-card" onclick="goToDate('${d}')">
            <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 6px;">
              <span style="font-weight:700; font-size:16px;">${formatDate(d)}</span>
              <span style="font-size:12px; color: var(--accent); font-weight:600;">Открыть →</span>
            </div>
            <div style="font-size:13px; color: var(--text-muted); line-height: 1.4;">${summary}</div>
          </div>
        `;
      });
    }

    function goToDate(d) {
      selectedDate = d;
      document.getElementById('selected-date').value = d;
      switchTab('workout', 'Дневник');
    }

    // Аналитика и Прогресс
    function renderProgressChart() {
      const selectedEx = document.getElementById('progress-select').value;
      const historyPoints = [];
      const notesList = [];
      let maxWeight = 0;
      let totalSets = 0;

      const sortedDates = Object.keys(db).sort();

      sortedDates.forEach(d => {
        const exItem = (db[d] || []).find(e => e.name === selectedEx);
        if (exItem) {
          let dayMax = 0;
          exItem.sets.forEach(s => {
            totalSets++;
            const w = parseFloat(s.weight) || 0;
            if (w > dayMax) dayMax = w;
            if (w > maxWeight) maxWeight = w;
          });

          if (dayMax > 0) {
            historyPoints.push({
              date: formatDateShort(d),
              weight: dayMax
            });
          }

          if (exItem.note && exItem.note.trim()) {
            notesList.push({ date: formatDate(d), note: exItem.note.trim() });
          }
        }
      });

      document.getElementById('stat-max-weight').innerText = `${maxWeight} кг`;
      document.getElementById('stat-total-sets').innerText = totalSets;

      // Отрисовка заметок
      const notesCont = document.getElementById('exercise-notes-history');
      if (notesList.length) {
        notesCont.innerHTML = notesList.reverse().map(n => `
          <div style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
            <div style="font-size: 11px; color: var(--accent); font-weight: 700;">${n.date}</div>
            <div style="color: #fff; margin-top: 2px;">${n.note}</div>
          </div>
        `).join('');
      } else {
        notesCont.innerHTML = '<span style="color: var(--text-muted);">Заметок пока нет</span>';
      }

      // График
      const ctx = document.getElementById('progressChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: historyPoints.map(p => p.date),
          datasets: [{
            data: historyPoints.map(p => p.weight),
            borderColor: '#ff4757',
            backgroundColor: 'rgba(255, 71, 87, 0.12)',
            fill: true,
            tension: 0.35,
            borderWidth: 3,
            pointRadius: 5,
            pointBackgroundColor: '#ff4757'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#282c3a' }, ticks: { color: '#8e95a5' } },
            y: { grid: { color: '#282c3a' }, ticks: { color: '#8e95a5' } }
          }
        }
      });
    }

    function addCustomExercise() {
      const input = document.getElementById('custom-ex-name');
      const val = input.value.trim();
      if (!val) return;
      if (!exercises.includes(val)) {
        exercises.push(val);
        localStorage.setItem('fs_exercises', JSON.stringify(exercises));
        renderSelects();
        input.value = '';
        alert('Упражнение сохранено в базу!');
      }
    }

    function formatDate(dStr) {
      if (!dStr) return '';
      const parts = dStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatDateShort(dStr) {
      const parts = dStr.split('-');
      return `${parts[2]}.${parts[1]}`;
    }

    // Экспорт / Импорт
    function exportData() {
      const data = { exercises, db };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `workouts_diary_${getTodayDate()}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.db) {
            db = imported.db;
            exercises = imported.exercises || exercises;
            localStorage.setItem('fs_diary_db', JSON.stringify(db));
            localStorage.setItem('fs_exercises', JSON.stringify(exercises));
            renderSelects();
            renderDayWorkout();
            alert('Данные успешно загружены!');
          }
        } catch (err) {
          alert('Ошибка при импорте файла');
        }
      };
      reader.readAsText(file);
    }

    init();
  </script>
</body>
</html>
